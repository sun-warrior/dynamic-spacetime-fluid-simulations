<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Spacetime Fluid - 3D Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #ccc; }
        input[type=range] { width: 100%; cursor: pointer; }
        .value-display { float: right; font-weight: bold; color: #00ffff; }
        .preset-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        button:hover { background: rgba(0, 255, 255, 0.2); border-color: #00ffff; }
        .formula { font-family: monospace; font-size: 0.75rem; color: #888; margin-top: 15px; }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Spacetime Fluid Parameters</h2>
        
        <div class="control-group">
            <label>Mass Density (ρm) <span id="val-mass" class="value-display">1.0</span></label>
            <input type="range" id="massDensity" min="0" max="150" step="1" value="1">
        </div>

        <div class="control-group">
            <label>Higgs Absorption (α) <span id="val-alpha" class="value-display">0.05</span></label>
            <input type="range" id="alpha" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>

        <div class="control-group">
            <label>Calculated Viscosity (μ) <span id="val-mu" class="value-display" style="color:#ff0055;">1.00</span></label>
        </div>

        <div class="preset-buttons">
            <button onclick="applyPreset('proton')">Quantum (Proton)</button>
            <button onclick="applyPreset('earth')">Planetary (Earth)</button>
            <button onclick="applyPreset('sun')">Stellar (Sun)</button>
            <button onclick="applyPreset('sagA')">Mega (Sagittarius A*)</button>
        </div>

        <div class="formula">
            μ(r) = μ_floor + (μ_0 - μ_floor) * e^(-(α * ρ_m)/10.0)<br><br>
            Color Map:<br>Cyan = High Viscosity (μ_0)<br>Magenta = Collapsed (μ_floor)
        </div>
    </div>

    <div id="instructions">Left Click to Rotate | Scroll to Zoom | Right Click to Pan</div>
    <div id="canvas-container"></div>

    <script>
        // --- 1. SET UP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. DYNAMIC SPACETIME FLUID MATH (GLSL SHADERS) ---
        
        // Uniforms feed live UI data directly to the GPU
        const uniforms = {
            massDensity: { value: 1.0 },
            alpha: { value: 0.05 },
            mu0: { value: 1.0 },
            muFloor: { value: 0.1 },
            beta: { value: 0.2 },
            kappa: { value: 2.0 },
            time: { value: 0.0 }
        };

        const vertexShader = `
            uniform float massDensity;
            uniform float alpha;
            uniform float mu0;
            uniform float muFloor;
            uniform float beta;
            uniform float kappa;
            uniform float time;

            varying float vViscosity;
            varying float vDepth;

            void main() {
                vec3 pos = position;
                
                float r = length(pos.xz);
                r = max(r, 0.1); 

                // 1. Viscosity Breakdown 
                float mu_r = muFloor + (mu0 - muFloor) * exp(-(alpha * massDensity) / 10.0);
                
                // 2. Absolute Amplitude (FIXED FOR QUANTUM LIMIT)
                // Subtract 1.0 so that the Proton (Mass 1.0) generates exactly 0.0 depth
                float effectiveMass = max(0.0, massDensity - 1.0);
                float Dmax = -(beta * effectiveMass * 20.0);
                
                // 3. Spatial Distribution Function
                float Phi = 1.0 / (r + kappa * mu_r);
                
                // 4. Final Depth
                float depth = Dmax * Phi;
                
                // 5. Frame Dragging
                float vortexStrength = (depth * 0.15) * (massDensity / 150.0);
                float s = sin(vortexStrength);
                float c = cos(vortexStrength);
                float newX = pos.x * c - pos.z * s;
                float newZ = pos.x * s + pos.z * c;
                
                pos.x = newX;
                pos.z = newZ;
                pos.y += depth; 
                
                vViscosity = mu_r;
                vDepth = depth;
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                gl_PointSize = max(1.0, 3.0 + depth * 0.1); 
            }
        `;

        const fragmentShader = `
            uniform float mu0;
            uniform float muFloor;
            
            varying float vViscosity;
            varying float vDepth;

            void main() {
                // Map viscosity to color: Cyan (High) to Magenta (Collapsed)
                float factor = clamp((vViscosity - muFloor) / (mu0 - muFloor), 0.0, 1.0);
                
                vec3 colorCyan = vec3(0.0, 1.0, 1.0);
                vec3 colorMagenta = vec3(1.0, 0.0, 1.0); // Pure Magenta
                
                vec3 finalColor = mix(colorMagenta, colorCyan, factor);

                // Make points circular
                vec2 circCoord = 2.0 * gl_PointCoord - 1.0;
                if (dot(circCoord, circCoord) > 1.0) {
                    discard;
                }

                // Render purely based on the viscosity factor without additive blowout
                gl_FragColor = vec4(finalColor, 0.85); 
            }
        `;

        // --- 3. GENERATE THE FLUID CONTINUUM ---
        const geometry = new THREE.PlaneGeometry(100, 100, 200, 200);
        // Rotate flat onto the X/Z axis
        geometry.rotateX(-Math.PI / 2); 

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            blending: THREE.NormalBlending, // Changed from AdditiveBlending
            depthWrite: false
        });

        const fluidPoints = new THREE.Points(geometry, material);
        scene.add(fluidPoints);

        // Add the Central "Mass" Entity
        const massGeo = new THREE.SphereGeometry(1.5, 32, 32);
        const massMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const centralMass = new THREE.Mesh(massGeo, massMat);
        scene.add(centralMass);

        // --- 4. UI INTERACTION LOGIC ---
        const massSlider = document.getElementById('massDensity');
        const alphaSlider = document.getElementById('alpha');
        const valMass = document.getElementById('val-mass');
        const valAlpha = document.getElementById('val-alpha');
        const valMu = document.getElementById('val-mu');

        function updateSimulation() {
            const m = parseFloat(massSlider.value);
            const a = parseFloat(alphaSlider.value);
            
            // Update Uniforms
            uniforms.massDensity.value = m;
            uniforms.alpha.value = a;
            
            // Update UI Text
            valMass.innerText = m.toFixed(1);
            valAlpha.innerText = a.toFixed(3);
            
            // Calculate and display live viscosity
            const calcMu = 0.1 + (1.0 - 0.1) * Math.exp(-(a * m) / 10.0);
            valMu.innerText = calcMu.toFixed(4);

            // Scale the central mass visually
            const scale = Math.max(0.5, Math.min(3.0, m / 20));
            centralMass.scale.set(scale, scale, scale);
        }

        massSlider.addEventListener('input', updateSimulation);
        alphaSlider.addEventListener('input', updateSimulation);

        // Presets Functionality
        window.applyPreset = function(preset) {
            if (preset === 'proton') {
                massSlider.value = 1;
                alphaSlider.value = 0.05;
            } else if (preset === 'earth') {
                massSlider.value = 10;
                alphaSlider.value = 0.05;
            } else if (preset === 'sun') {
                massSlider.value = 50;
                alphaSlider.value = 0.05;
            } else if (preset === 'sagA') {
                massSlider.value = 150;
                alphaSlider.value = 0.05;
            }
            updateSimulation();
        }

        // Initialize values
        updateSimulation();

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            uniforms.time.value += 0.05;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
